# 模式：外部定时触发（推荐）
# 由 cron-job.org 等调用 workflow_dispatch；另含北京夜间～凌晨若干 schedule 保底。
name: GLaDOS签到 · 外部定时触发

on:
  workflow_dispatch:
  schedule:
    # 以下均为 UTC = 北京时间 - 8 小时
    - cron: '0 15 * * *' # 北京 23:00
    - cron: '30 15 * * *' # 北京 23:30 硬保底
    - cron: '45 15 * * *' # 北京 23:45 补跑
    - cron: '0 16 * * *' # 北京 00:00（新一天高分窗）
    - cron: '30 16 * * *' # 北京 00:30
    - cron: '0 17 * * *' # 北京 01:00

jobs:
  checkin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run smart checkin
        run: node main.js
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
          GLADOS_UA: ${{ secrets.GLADOS_UA }}
          NOTIFY: ${{ secrets.NOTIFY }}
          DOMAIN: ${{ secrets.DOMAIN }}
          AUTO_EXCHANGE: ${{ secrets.AUTO_EXCHANGE }}
          EXCHANGE_THRESHOLD: ${{ secrets.EXCHANGE_THRESHOLD }}
