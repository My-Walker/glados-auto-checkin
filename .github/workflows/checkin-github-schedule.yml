# 模式：仅 GitHub Schedule
# 轮询间隔在下方 cron 中配置（默认示例为每 30 分钟，可按需修改）。
# 与「外部定时触发」不要同时启用主轮询，以免双跑；默认请 Disable 本工作流。
name: GLaDOS签到 · 仅GitHub Schedule

on:
  schedule:
    # 间隔可改；GitHub schedule 可能延迟或丢弃
    - cron: '*/30 * * * *'
    # 约北京 23:45 保底（本模式自洽）
    - cron: '45 15 * * *'
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run smart checkin
        run: node main.js
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
          GLADOS_UA: ${{ secrets.GLADOS_UA }}
          NOTIFY: ${{ secrets.NOTIFY }}
          DOMAIN: ${{ secrets.DOMAIN }}
          AUTO_EXCHANGE: ${{ secrets.AUTO_EXCHANGE }}
          EXCHANGE_THRESHOLD: ${{ secrets.EXCHANGE_THRESHOLD }}
